<section id="toll" class="bg-light py-4">
    <div class="container">
        <div class="row mt-2">
            <div class="col-12 text-center">
                <img src="assets/parkingarea.jpg" alt="Parking Ticket Tool" class="cus-img-fluid">
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-7">
                <div class="row">
                    <div class="col-12 text-center">
                        <h5 class="text-primary mb-4">New Ticket</h5>
                    </div>
                </div>
                <div class="card p-3 bg-transparent shadow">
                    <div class="row">
                        <div class="col-12">
                            <div class="row mb-2">
                                <div class="col-3">
                                    <div class="Bike">
                                        <button class="btn" [ngClass]="parkingObject.vehicle_type == 'Bike' ? 'selectedVehicle' : ''">
                                            <img src="assets/bike1.jpg" (click)="assignedVehicleType('Bike')" alt="Bike" class="h-100 w-100">
                                        </button>
                                    </div>
                                </div>
                                <div class="col-3">
                                    <div class="Auto">
                                        <button class="btn" [ngClass]="parkingObject.vehicle_type == 'Auto' ? 'selectedVehicle' : ''">
                                            <img src="assets/auto.jpg" (click)="assignedVehicleType('Auto')" alt="Auto" class="h-100 w-100">
                                        </button>
                                    </div>
                                </div>
                                <div class="col-3">
                                    <div class="Car">
                                        <button class="btn" [ngClass]="parkingObject.vehicle_type == 'Car' ? 'selectedVehicle' : ''">
                                            <img src="assets/car.jpg" (click)="assignedVehicleType('Car')" alt="Car" class="h-100 w-100">
                                        </button>
                                    </div>
                                </div>
                                <div class="col-3">
                                    <div class="Bus">
                                        <button class="btn" [ngClass]="parkingObject.vehicle_type == 'Bus' ? 'selectedVehicle' : ''">
                                            <img src="assets/bus.jpg" (click)="assignedVehicleType('Bus')" alt="Bus" class="h-100 w-100">
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-6 mt-2">
                                    <input type="text" class="form-control" [(ngModel)]="parkingObject.licence_plate" placeholder="License Plate"
                                        aria-label="License Plate">
                                </div>
                                <div class="col-6 mt-2">
                                    <input type="text" class="form-control" [(ngModel)]="parkingObject.mobileNo" placeholder="Phone Number"
                                        aria-label="Phone Number">
                                </div>
                                <div class="col-12 mt-2">
                                    <label>Duration & Charges</label>
                                    <div class="d-flex">
                                        <div class="btn-color mt-2 me-2" [ngClass]="parkingObject.ticket_amount == 10 ? 'bg-primary text-white' : ''">
                                            <button class="btn px-3 py-2" (click)="assignedTicketAmount(10)">
                                                <span class="fw-semibold me-1">1 Hour</span>
                                                <span class="">&#x20B9; 10</span>
                                            </button>
                                        </div>
                                        <div class="btn-color mt-2 me-2" [ngClass]="parkingObject.ticket_amount == 20 ? 'bg-primary text-white' : ''">
                                            <button class="btn px-3 py-2" (click)="assignedTicketAmount(20)">
                                                <span class="fw-semibold me-1">2 Hour</span>
                                                <span class="">&#x20B9; 20</span>
                                            </button>
                                        </div>
                                        <div class="btn-color mt-2 me-2" [ngClass]="parkingObject.ticket_amount == 30 ? 'bg-primary text-white' : ''">
                                            <button class="btn px-3 py-2" (click)="assignedTicketAmount(30)">
                                                <span class="fw-semibold me-1">6 Hour</span>
                                                <span class="">&#x20B9; 30</span>
                                            </button>
                                        </div>
                                        <div class="btn-color mt-2 me-2" [ngClass]="parkingObject.ticket_amount == 200 ? 'bg-primary text-white' : ''">
                                            <button class="btn px-3 py-2" (click)="assignedTicketAmount(200)">
                                                <span class="fw-semibold me-1">1 Day</span>
                                                <span class="">&#x20B9; 200</span>
                                            </button>
                                        </div>
                                        <div class="btn-color mt-2 me-2" [ngClass]="parkingObject.ticket_amount == 400 ? 'bg-primary text-white' : ''">
                                            <button class="btn px-3 py-2" (click)="assignedTicketAmount(400)">
                                                <span class="fw-semibold me-1">2 Day</span>
                                                <span class="">&#x20B9; 400</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <!-- {{parkingObject | json}} -->
                                <div class="col-12 mt-5 text-end d-flex justify-content-between text-end">
                                    <button class="btn btn-secondary m-2" (click)="resetForm()">Refresh</button>
                                    <button class="btn btn-primary m-2" (click)="createParking()">Create Ticket</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-5">
                <div class="row">
                    <div class="col-12 text-center">
                        <h5 class="text-primary mb-4">Parked Vehicles</h5>
                    </div>
                    <div class="col-12">
                       <table class="table table-striped table-hover shadow">
                            <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Vehicle Number</th>
                                   <th scope="col">Contact</th>
                                   <th scope="col">Charges</th>
                                   <th scope="col">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- <tr *ngFor="let vehicle of parkedVehicles; let index = index">
                                    <th scope="row">{{ index + 1 }}</th>
                                    <td>{{ vehicle.licence_plate }}</td>
                                    <td>{{ vehicle.mobileNo}}</td>
                                    <td>{{ vehicle.ticket_number }}</td>
                                    <td>
                                        <button class="btn btn-sm btn-success" *ngIf="vehicle.out_time == null" (click)="markOut(vehicle.licence_plate)">Mark Out</button>
                                        <span *ngIf="vehicle.out_time !== null">{{ vehicle.out_time | date:'dd-MM-yy'}}-{{ vehicle.out_time | date:'hh:mm'}}</span>
                                    </td>
                                </tr> -->
                                <tr>
                                    <th scope="row">1</th>
                                    <td>MH13 CD 1234</td>
                                    <td>98877663344</td>
                                    <td>60</td>
                                    <td>Completed</td>
                                  </tr>
                                  <tr>
                                    <th scope="row">2</th>
                                    <td>MH13 CD 3353</td>
                                    <td>8877663344</td>
                                    <td>120</td>
                                    <td>Not Completed</td>
                                  </tr>
                                <tr>
                                    <th scope="row">3</th>
                                    <td>MH13 CD 1276</td>
                                    <td>5477663344</td>
                                    <td>60</td>
                                    <td>Completed</td>
                                  </tr>
                                  <tr>
                                    <th scope="row">4</th>
                                    <td>MH13 CD 4667</td>
                                    <td>8777663344</td>
                                    <td>120</td>
                                    <td>Not Completed</td>
                                  </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
